<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Four Panel View</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://global.oktacdn.com/okta-auth-js/7.5.1/okta-auth-js.min.js"></script>
    <script src="../iframe-console-logger.js"></script>
    <script src="../n9-config.js"></script>
    <script src="../n9-iframe-auth.js" defer></script>
  </head>
  <body class="dashboard">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <div>Checking authentication...</div>
    </div>

    <div id="app" style="display: none">
      <header>
        <h1>Dashboard</h1>
        <div class="user-info">
          <span class="user-email" id="userEmail">Loading...</span>
        </div>
      </header>

      <div class="container">
        <div class="panels-container">
          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">
                <button onclick="navigateIframeHome('panel-1-iframe')" class="home-btn" title="Home">🏠</button>
                <span class="breadcrumb" id="panel-1-breadcrumb"></span>
                <span class="route-name" id="panel-1-route">Panel 1</span>
              </div>
            </div>
            <div class="panel-body">
              <div class="console-panel" id="console-panel-1">
                <div class="console-header">
                  <span>Console</span>
                  <button onclick="IframeConsoleLogger.clear('panel-1')" class="console-clear-btn" title="Clear console">Clear</button>
                </div>
                <div class="console-content" id="console-content-panel-1"></div>
              </div>
              <div class="panel-content" id="panel-1">
                <div class="placeholder">
                  <div class="status-message">Authenticating...</div>
                </div>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">
                <button onclick="navigateIframeHome('panel-2-iframe')" class="home-btn" title="Home">🏠</button>
                <span class="breadcrumb" id="panel-2-breadcrumb"></span>
                <span class="route-name" id="panel-2-route">Panel 2</span>
              </div>
            </div>
            <div class="panel-body">
              <div class="console-panel" id="console-panel-2">
                <div class="console-header">
                  <span>Console</span>
                  <button onclick="IframeConsoleLogger.clear('panel-2')" class="console-clear-btn" title="Clear console">Clear</button>
                </div>
                <div class="console-content" id="console-content-panel-2"></div>
              </div>
              <div class="panel-content" id="panel-2">
                <div class="placeholder">
                  <div class="status-message">Authenticating...</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
